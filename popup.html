<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoposoSort</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f2f2f2;
            margin: 0;
            padding: 20px;
            width: 200px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #00ff00; /* Techy Green */
            margin-bottom: 15px;
        }

        h3 {
            font-size: 18px;
            color: #ffd700; /* Techy Yellow */
            margin-bottom: 10px;
        }

        button {
            background-color: #00ff00; /* Techy Green */
            color: #1a1a1a;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #32cd32; /* Darker green for hover */
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888888;
        }
    </style>
</head>
<body>
<img src="icon128.png" alt="Demo Logo" class="logo">
<h1>RopoSort</h1>
<h3>Sort By</h3>
<button id="sortPrice">Price</button>

<footer>© 2024 RopoSort</footer>
<script src="popup.js"></script>
</body>
</html>
